[env:megaatmega2560]
platform = atmelavr
board = megaatmega2560
framework = arduino
lib_deps = 
	miguelbalboa/MFRC522@^1.4.12
	adafruit/SdFat - Adafruit Fork@^2.3.53
	bblanchon/ArduinoJson@^7.4.2
upload_port=COM8